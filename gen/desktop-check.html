<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>桌面布局校验</title>
<style>
  html,body{margin:0;background:#05080c;font-family:system-ui,sans-serif;}
  .frame{width:1440px;height:820px;transform:scale(var(--s));transform-origin:top left;}
  .scaler{width:calc(1440px * var(--s));height:calc(820px * var(--s));overflow:hidden;margin:0 auto;}
  iframe{width:1440px;height:820px;border:0;display:block;}
</style>
</head>
<body>
  <div class="scaler" id="scaler">
    <div class="frame">
      <iframe src="../index.html" title="云山行"></iframe>
    </div>
  </div>
  <script>
    // 按可用宽度自动缩放，填满当前浏览器面板
    const s = Math.min((window.innerWidth - 8) / 1440, (window.innerHeight - 8) / 820);
    document.documentElement.style.setProperty('--s', s);
  </script>
</body>
</html>
